[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "descartes-decisions"
version = "0.1.0"
description = "Record the analysis decisions of LLM agents as reviewable cards in a YAML map next to the code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Elnur Imamaliyev" }]
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "jsonschema>=4"]
keywords = ["reproducibility", "data analysis", "decisions", "llm agents", "provenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
descartes = "descartes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/descartes"]

[tool.hatch.build.targets.wheel.force-include]
"spec/decision-map.schema.json" = "descartes/decision-map.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
